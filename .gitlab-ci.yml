stages:
  - security
  - lint
  - test
  - architecture
  - docs

secret_scan:
  image: alpine:3.20
  stage: security
  before_script:
    - apk add --no-cache bash grep findutils
  script:
    - ./scripts/check-secrets.sh

.default_debian:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends bash shellcheck bats ca-certificates git

shellcheck:
  extends: .default_debian
  stage: lint
  script:
    - bash -n install.sh
    - for f in lib/*.sh scripts/*.sh tests/helpers/*.sh; do bash -n "$f"; done
    - shellcheck -x -e SC2317 -S error install.sh lib/*.sh scripts/*.sh
    - bash -n tests/helpers/fake-docker.sh

unit_tests:
  extends: .default_debian
  stage: test
  script:
    - bats tests

architecture_impact:
  image: alpine:3.20
  stage: architecture
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash git
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=100
  script:
    - bash scripts/check-architecture-impact.sh

generate_diagrams:
  image: docker:27-cli
  stage: docs
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache bash
  script:
    - ./scripts/generate-diagrams.sh
  artifacts:
    name: "soclab-diagrams-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs/diagrams/generated/*.svg
    expire_in: 30 days

mkdocs_check:
  image: python:3.13-slim
  stage: docs
  script:
    - pip install --no-cache-dir mkdocs==1.6.1
    - mkdocs build --strict --site-dir public-check
  artifacts:
    when: always
    paths:
      - public-check/

pages:
  image: python:3.13-slim
  stage: docs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pip install --no-cache-dir mkdocs==1.6.1
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public/
